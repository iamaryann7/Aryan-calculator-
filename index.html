<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aryan Calculator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#050b16;
    --bg2:#0c1930;
    --card:rgba(13,28,48,.92);
    --screen:#13243b;
    --btn:#192d47;
    --text:#f7f9ff;
    --muted:#91a5c2;
    --blue:#268cff;
    --orange:#ff9f0a;
    --pink:#ed3975;
    --line:rgba(56,151,255,.42);
}

body.light{
    --bg:#eaf1fb;
    --bg2:#d7e4f5;
    --card:rgba(255,255,255,.94);
    --screen:#eef4fb;
    --btn:#fff;
    --text:#152238;
    --muted:#63738a;
    --line:rgba(38,140,255,.3);
}

body{
    min-height:100vh;
    padding:20px 12px 35px;
    display:flex;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);

    background:
    radial-gradient(circle at 15% 10%,rgba(0,140,255,.20),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(100,50,255,.20),transparent 32%),
    linear-gradient(145deg,var(--bg),var(--bg2));

    transition:.3s;
}

.app{
    width:100%;
    max-width:680px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

/* YOUR PHOTO */

.profile{
    width:76px;
    height:76px;
    border-radius:23px;
    overflow:hidden;
    flex-shrink:0;

    border:3px solid #2292ff;

    background:#14253d;

    box-shadow:
    0 0 12px rgba(34,146,255,.75),
    0 0 30px rgba(34,146,255,.25);
}

.profile img{
    width:100%;
    height:100%;
    display:block;

    object-fit:cover;
    object-position:center 25%;
}

/* TITLE */

.title{
    font-size:clamp(25px,7vw,42px);
    line-height:1;
    letter-spacing:-1.5px;
}

.title span{
    color:#2494ff;
}

.subtitle{
    margin-top:9px;
    color:var(--muted);
    font-size:clamp(9px,2.5vw,14px);
    letter-spacing:4px;
}

/* THEME */

.theme{
    width:62px;
    height:62px;
    border-radius:50%;

    border:1px solid rgba(100,180,255,.25);
    background:rgba(28,49,76,.75);

    font-size:28px;
    cursor:pointer;

    transition:.2s;
}

.theme:active{
    transform:scale(.9);
}

/* CALCULATOR */

.calculator{
    padding:22px;
    border-radius:38px;

    background:var(--card);
    border:1px solid var(--line);

    box-shadow:
    0 25px 60px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.05);
}

/* DISPLAY */

.display-box{
    height:220px;
    padding:25px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-align:right;

    background:var(--screen);
    border:1px solid rgba(130,170,210,.18);
    border-radius:30px;

    overflow:hidden;
    margin-bottom:22px;
}

.expression{
    min-height:28px;
    margin-bottom:8px;

    color:var(--muted);
    font-size:17px;

    word-break:break-all;
}

.display{
    font-size:clamp(48px,14vw,72px);
    line-height:1;
    font-weight:500;

    word-break:break-all;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.btn{
    height:80px;

    border-radius:22px;
    border:1px solid rgba(150,190,230,.12);

    background:var(--btn);
    color:var(--text);

    font-size:25px;
    font-weight:500;

    cursor:pointer;

    box-shadow:
    0 7px 14px rgba(0,0,0,.16),
    inset 0 1px 0 rgba(255,255,255,.03);

    transition:.12s;
}

.btn:active{
    transform:scale(.93);
    filter:brightness(1.15);
}

.memory{
    font-size:18px;
    color:var(--muted);
}

.ac{
    background:var(--pink);
    color:#fff;
    border:none;
}

.operator{
    background:var(--orange);
    color:#fff;
    border:none;
}

.equal{
    background:linear-gradient(135deg,#2196ff,#315cff);
    color:#fff;
    border:none;

    box-shadow:
    0 8px 25px rgba(33,130,255,.35);
}

.zero{
    grid-column:span 2;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:35px;
}

.quote{
    color:var(--muted);
    font-size:clamp(10px,3vw,15px);
    letter-spacing:4px;
    line-height:1.7;
}

.name{
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
    letter-spacing:5px;
}

/* MOBILE */

@media(max-width:500px){

    body{
        padding:18px 10px 28px;
    }

    .calculator{
        padding:18px;
        border-radius:32px;
    }

    .profile{
        width:68px;
        height:68px;
        border-radius:20px;
    }

    .theme{
        width:56px;
        height:56px;
        font-size:25px;
    }

    .display-box{
        height:205px;
        padding:20px;
        border-radius:27px;
    }

    .buttons{
        gap:10px;
    }

    .btn{
        height:68px;
        border-radius:19px;
        font-size:23px;
    }

    .memory{
        font-size:16px;
    }
}

@media(max-width:370px){

    .profile{
        width:58px;
        height:58px;
    }

    .brand{
        gap:9px;
    }

    .subtitle{
        letter-spacing:2px;
    }

    .calculator{
        padding:13px;
    }

    .buttons{
        gap:7px;
    }

    .btn{
        height:61px;
        border-radius:16px;
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

    <div class="brand">

        <div class="profile">
            <img
                src="./IMG_20260904_180013.jpg"
                alt="Aryan"
                onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=&quot;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;height:100%&quot;>Photo</span>';"
            >
        </div>

        <div>
            <h1 class="title">
                Aryan <span>Calculator</span>
            </h1>

            <p class="subtitle">
                SIMPLE • FAST • RELIABLE
            </p>
        </div>

    </div>

    <button class="theme" onclick="toggleTheme()" id="theme">
        ☀️
    </button>

</div>


<!-- CALCULATOR -->

<div class="calculator">

    <div class="display-box">

        <div class="expression" id="expression"></div>

        <div class="display" id="display">
            0
        </div>

    </div>


    <div class="buttons">

        <!-- MEMORY -->

        <button class="btn memory" onclick="memoryClear()">MC</button>
        <button class="btn memory" onclick="memoryRecall()">MR</button>
        <button class="btn memory" onclick="memoryAdd()">M+</button>
        <button class="btn memory" onclick="memorySubtract()">M−</button>
        <button class="btn ac" onclick="clearAll()">AC</button>


        <!-- SPECIAL -->

        <button class="btn" onclick="input('(')">(</button>
        <button class="btn" onclick="input(')')">)</button>
        <button class="btn" onclick="percent()">%</button>
        <button class="btn" onclick="backspace()">⌫</button>
        <button class="btn operator" onclick="input('÷')">÷</button>


        <!-- NUMBERS -->

        <button class="btn" onclick="input('7')">7</button>
        <button class="btn" onclick="input('8')">8</button>
        <button class="btn" onclick="input('9')">9</button>
        <button class="btn operator" onclick="input('×')">×</button>
        <button class="btn" onclick="input('.')">.</button>


        <button class="btn" onclick="input('4')">4</button>
        <button class="btn" onclick="input('5')">5</button>
        <button class="btn" onclick="input('6')">6</button>
        <button class="btn operator" onclick="input('−')">−</button>
        <button class="btn" onclick="input('00')">00</button>


        <button class="btn" onclick="input('1')">1</button>
        <button class="btn" onclick="input('2')">2</button>
        <button class="btn" onclick="input('3')">3</button>
        <button class="btn operator" onclick="input('+')">+</button>
        <button class="btn equal" onclick="calculate()">=</button>


        <button class="btn zero" onclick="input('0')">0</button>

    </div>

</div>


<!-- FOOTER -->

<div class="footer">

    <div class="quote">
        SMALL CALCULATIONS BUILD BIG DREAMS
    </div>

    <div class="name">
        — ARYAN —
    </div>

</div>

</div>


<script>

let current = "";
let memory = 0;


/* DISPLAY */

function update(){

    document.getElementById("display").textContent =
        current || "0";

}


/* INPUT */

function input(value){

    if(current === "Error"){
        current = "";
    }

    current += value;

    update();

}


/* CLEAR */

function clearAll(){

    current = "";

    document.getElementById("expression").textContent = "";

    update();

}


/* BACKSPACE */

function backspace(){

    current = current.slice(0,-1);

    update();

}


/* CALCULATE */

function calculate(){

    if(!current) return;

    try{

        let expression = current;

        let safe = expression
            .replace(/×/g,"*")
            .replace(/÷/g,"/")
            .replace(/−/g,"-");

        let result = Function(
            '"use strict"; return (' + safe + ')'
        )();

        if(!Number.isFinite(result)){
            throw new Error();
        }

        result =
            Math.round(result * 1000000000000)
            / 1000000000000;

        document.getElementById("expression")
            .textContent = expression + " =";

        current = String(result);

        update();

    }
    catch{

        current = "Error";

        update();

    }

}


/* PERCENT */

function percent(){

    if(!current) return;

    try{

        let safe = current
            .replace(/×/g,"*")
            .replace(/÷/g,"/")
            .replace(/−/g,"-");

        let result = Function(
            '"use strict"; return (' + safe + ')'
        )();

        current = String(result / 100);

        update();

    }
    catch{

        current = "Error";

        update();

    }

}


/* GET NUMBER */

function getNumber(){

    try{

        let safe = current
            .replace(/×/g,"*")
            .replace(/÷/g,"/")
            .replace(/−/g,"-");

        return Function(
            '"use strict"; return (' + safe + ')'
        )();

    }
    catch{

        return NaN;

    }

}


/* MEMORY */

function memoryClear(){

    memory = 0;

}

function memoryRecall(){

    current = String(memory);

    update();

}

function memoryAdd(){

    let value = getNumber();

    if(!isNaN(value)){
        memory += value;
    }

}

function memorySubtract(){

    let value = getNumber();

    if(!isNaN(value)){
        memory -= value;
    }

}


/* THEME */

function toggleTheme(){

    document.body.classList.toggle("light");

    let button =
        document.getElementById("theme");

    if(document.body.classList.contains("light")){

        button.textContent = "🌙";

        localStorage.setItem("theme","light");

    }
    else{

        button.textContent = "☀️";

        localStorage.setItem("theme","dark");

    }

}


/* LOAD THEME */

if(localStorage.getItem("theme") === "light"){

    document.body.classList.add("light");

    document.getElementById("theme").textContent = "🌙";

}


/* KEYBOARD */

document.addEventListener("keydown",function(e){

    let key = e.key;

    if(
        (key >= "0" && key <= "9") ||
        key === "." ||
        key === "(" ||
        key === ")"
    ){

        input(key);

    }

    else if(key === "+"){
        input("+");
    }

    else if(key === "-"){
        input("−");
    }

    else if(key === "*"){
        input("×");
    }

    else if(key === "/"){
        input("÷");
    }

    else if(key === "%"){
        percent();
    }

    else if(key === "Enter" || key === "="){
        calculate();
    }

    else if(key === "Backspace"){
        backspace();
    }

    else if(key === "Escape"){
        clearAll();
    }

});

</script>

</body>
</html>
