<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aryan Calculator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg1: #06101f;
    --bg2: #101b31;
    --panel: rgba(13, 29, 50, 0.92);
    --display: #142238;
    --button: #182a42;
    --text: #f5f7ff;
    --muted: #94a6c2;
    --blue: #238cff;
    --orange: #ff9f0a;
    --pink: #ed3975;
    --border: rgba(55, 151, 255, 0.45);
}

body.light {
    --bg1: #eef4ff;
    --bg2: #dbe7f7;
    --panel: rgba(255,255,255,0.92);
    --display: #edf3fa;
    --button: #ffffff;
    --text: #172238;
    --muted: #66758c;
    --border: rgba(35,140,255,0.35);
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 20% 10%, rgba(0,126,255,.18), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(100,50,255,.18), transparent 30%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
    display: flex;
    justify-content: center;
    padding: 22px 12px 35px;
    transition: .3s;
}

.app {
    width: 100%;
    max-width: 680px;
}

/* HEADER */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

/* YOUR PHOTO */
.profile-photo {
    width: 76px;
    height: 76px;
    border-radius: 22px;
    overflow: hidden;
    border: 3px solid #2196ff;
    box-shadow:
        0 0 12px rgba(33,150,255,.65),
        0 0 25px rgba(33,150,255,.25);
    flex-shrink: 0;
    background: #15263e;
}

.profile-photo img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 25%;
}

.brand h1 {
    font-size: clamp(25px, 7vw, 42px);
    line-height: 1;
    letter-spacing: -1px;
}

.brand h1 span {
    color: #2495ff;
}

.brand p {
    margin-top: 8px;
    font-size: clamp(9px, 2.5vw, 14px);
    letter-spacing: 4px;
    color: var(--muted);
}

/* THEME BUTTON */
.theme-toggle {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 1px solid rgba(100,180,255,.25);
    background: rgba(30,50,75,.7);
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,.2);
    transition: .25s;
    flex-shrink: 0;
}

.theme-toggle:active {
    transform: scale(.92);
}

/* CALCULATOR */
.calculator {
    padding: 22px;
    border-radius: 38px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow:
        0 20px 50px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.04);
}

/* DISPLAY */
.display-box {
    min-height: 220px;
    border-radius: 30px;
    background: var(--display);
    border: 1px solid rgba(130,170,210,.18);
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    text-align: right;
    overflow: hidden;
    margin-bottom: 22px;
}

.expression {
    min-height: 30px;
    font-size: 17px;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 8px;
}

.display {
    font-size: clamp(48px, 14vw, 72px);
    font-weight: 500;
    line-height: 1;
    word-break: break-all;
}

/* BUTTON GRID */
.buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 13px;
}

button.calc-btn {
    height: 82px;
    border: 1px solid rgba(150,190,230,.13);
    border-radius: 22px;
    background: var(--button);
    color: var(--text);
    font-size: 26px;
    font-weight: 500;
    cursor: pointer;
    box-shadow:
        0 7px 14px rgba(0,0,0,.15),
        inset 0 1px 0 rgba(255,255,255,.03);
    transition: transform .12s, filter .12s;
}

button.calc-btn:active {
    transform: scale(.94);
    filter: brightness(1.18);
}

.memory {
    font-size: 19px !important;
    color: var(--muted) !important;
}

.ac {
    background: var(--pink) !important;
    color: white !important;
    border: none !important;
}

.operator {
    background: var(--orange) !important;
    color: white !important;
    border: none !important;
}

.equal {
    background: linear-gradient(135deg, #2196ff, #345eff) !important;
    color: white !important;
    border: none !important;
    box-shadow: 0 8px 22px rgba(33,120,255,.35) !important;
}

/* ZERO BUTTON */
.zero {
    grid-column: span 2;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 38px;
}

.footer .quote {
    color: var(--muted);
    font-size: clamp(11px, 3vw, 15px);
    letter-spacing: 5px;
    line-height: 1.7;
}

.footer .name {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 5px;
}

/* RESPONSIVE */
@media (max-width: 500px) {
    body {
        padding: 18px 10px 28px;
    }

    .calculator {
        padding: 18px;
        border-radius: 32px;
    }

    .profile-photo {
        width: 68px;
        height: 68px;
        border-radius: 19px;
    }

    .theme-toggle {
        width: 56px;
        height: 56px;
        font-size: 25px;
    }

    .display-box {
        min-height: 205px;
        padding: 20px;
        border-radius: 27px;
    }

    .buttons {
        gap: 10px;
    }

    button.calc-btn {
        height: 68px;
        border-radius: 19px;
        font-size: 23px;
    }

    .memory {
        font-size: 16px !important;
    }
}

@media (max-width: 370px) {
    .brand {
        gap: 9px;
    }

    .profile-photo {
        width: 58px;
        height: 58px;
    }

    .brand p {
        letter-spacing: 2px;
    }

    .calculator {
        padding: 13px;
    }

    .buttons {
        gap: 7px;
    }

    button.calc-btn {
        height: 61px;
        border-radius: 16px;
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">

        <div class="brand">

            <!-- YOUR PHOTO -->
            <div class="profile-photo">
                <img src="profile.jpg" alt="Aryan">
            </div>

            <div>
                <h1>Aryan <span>Calculator</span></h1>
                <p>SIMPLE • FAST • RELIABLE</p>
            </div>

        </div>

        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
            ☀️
        </button>

    </div>


    <!-- CALCULATOR -->
    <div class="calculator">

        <!-- DISPLAY -->
        <div class="display-box">
            <div class="expression" id="expression"></div>
            <div class="display" id="display">0</div>
        </div>


        <!-- BUTTONS -->
        <div class="buttons">

            <!-- MEMORY -->
            <button class="calc-btn memory" onclick="memoryClear()">MC</button>
            <button class="calc-btn memory" onclick="memoryRecall()">MR</button>
            <button class="calc-btn memory" onclick="memoryAdd()">M+</button>
            <button class="calc-btn memory" onclick="memorySubtract()">M−</button>
            <button class="calc-btn ac" onclick="clearAll()">AC</button>

            <!-- SPECIAL -->
            <button class="calc-btn" onclick="input('(')">(</button>
            <button class="calc-btn" onclick="input(')')">)</button>
            <button class="calc-btn" onclick="percent()">%</button>
            <button class="calc-btn" onclick="backspace()">⌫</button>
            <button class="calc-btn operator" onclick="input('÷')">÷</button>

            <!-- NUMBERS -->
            <button class="calc-btn" onclick="input('7')">7</button>
            <button class="calc-btn" onclick="input('8')">8</button>
            <button class="calc-btn" onclick="input('9')">9</button>
            <button class="calc-btn operator" onclick="input('×')">×</button>
            <button class="calc-btn" onclick="input('.')">.</button>

            <button class="calc-btn" onclick="input('4')">4</button>
            <button class="calc-btn" onclick="input('5')">5</button>
            <button class="calc-btn" onclick="input('6')">6</button>
            <button class="calc-btn operator" onclick="input('−')">−</button>
            <button class="calc-btn" onclick="input('00')">00</button>

            <button class="calc-btn" onclick="input('1')">1</button>
            <button class="calc-btn" onclick="input('2')">2</button>
            <button class="calc-btn" onclick="input('3')">3</button>
            <button class="calc-btn operator" onclick="input('+')">+</button>
            <button class="calc-btn equal" onclick="calculate()">=</button>

            <button class="calc-btn zero" onclick="input('0')">0</button>

        </div>

    </div>


    <!-- FOOTER -->
    <div class="footer">
        <div class="quote">
            SMALL CALCULATIONS BUILD BIG DREAMS
        </div>

        <div class="name">
            — ARYAN —
        </div>
    </div>

</div>


<script>

let current = "";
let memory = 0;
let lastAnswer = "";


/* DISPLAY */
function updateDisplay() {

    document.getElementById("display").textContent =
        current || "0";

}


/* INPUT */
function input(value) {

    if (current === "Error") {
        current = "";
    }

    current += value;

    updateDisplay();
}


/* CLEAR */
function clearAll() {

    current = "";
    lastAnswer = "";

    document.getElementById("expression").textContent = "";

    updateDisplay();
}


/* BACKSPACE */
function backspace() {

    current = current.slice(0, -1);

    updateDisplay();
}


/* PERCENT */
function percent() {

    if (!current) return;

    try {

        let safe = current
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/−/g, "-");

        let result = Function(
            '"use strict"; return (' + safe + ')'
        )();

        current = String(result / 100);

        updateDisplay();

    } catch {

        current = "Error";
        updateDisplay();

    }

}


/* CALCULATE */
function calculate() {

    if (!current) return;

    try {

        let expression = current;

        let safe = expression
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/−/g, "-");

        let result = Function(
            '"use strict"; return (' + safe + ')'
        )();

        if (!Number.isFinite(result)) {
            throw new Error();
        }

        result = Math.round(result * 1000000000000) / 1000000000000;

        document.getElementById("expression").textContent =
            expression + " =";

        current = String(result);
        lastAnswer = String(result);

        updateDisplay();

    } catch {

        current = "Error";
        updateDisplay();

    }

}


/* MEMORY CLEAR */
function memoryClear() {

    memory = 0;

}


/* MEMORY RECALL */
function memoryRecall() {

    current = String(memory);

    updateDisplay();

}


/* MEMORY ADD */
function memoryAdd() {

    let value = getNumber();

    if (!isNaN(value)) {
        memory += value;
    }

}


/* MEMORY SUBTRACT */
function memorySubtract() {

    let value = getNumber();

    if (!isNaN(value)) {
        memory -= value;
    }

}


/* GET CURRENT NUMBER */
function getNumber() {

    try {

        let safe = current
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/−/g, "-");

        return Function(
            '"use strict"; return (' + safe + ')'
        )();

    } catch {

        return NaN;

    }

}


/* THEME */
function toggleTheme() {

    document.body.classList.toggle("light");

    const button =
        document.getElementById("themeBtn");

    if (document.body.classList.contains("light")) {
        button.textContent = "🌙";
        localStorage.setItem("theme", "light");
    } else {
        button.textContent = "☀️";
        localStorage.setItem("theme", "dark");
    }

}


/* LOAD THEME */
if (localStorage.getItem("theme") === "light") {

    document.body.classList.add("light");

    document.getElementById("themeBtn").textContent = "🌙";

}


/* KEYBOARD SUPPORT */
document.addEventListener("keydown", function(event) {

    const key = event.key;

    if (
        (key >= "0" && key <= "9") ||
        key === "." ||
        key === "(" ||
        key === ")"
    ) {

        input(key);

    }

    else if (key === "+") {
        input("+");
    }

    else if (key === "-") {
        input("−");
    }

    else if (key === "*") {
        input("×");
    }

    else if (key === "/") {
        input("÷");
    }

    else if (key === "%") {
        percent();
    }

    else if (key === "Enter" || key === "=") {
        calculate();
    }

    else if (key === "Backspace") {
        backspace();
    }

    else if (key === "Escape") {
        clearAll();
    }

});

</script>

</body>
</html>
